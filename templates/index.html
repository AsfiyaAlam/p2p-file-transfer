<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P File Transfer & Chat</title>
  <style>
    :root {
      /* Original Deep Blue / Slate Theme */
      --bg: #0b0f19;
      --sidebar-bg: #131b2e;
      --chat-bg: #0b0f19;
      --header-bg: #131b2e;
      
      --message-in: #1e293b;
      --message-out: #2563eb;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.25);
      
      --border: #222f4c;
      --input-bg: #1e293b;
      
      --success: #10b981;
      --danger: #ef4444;
      
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }

    /* Sidebar (Left) */
    .sidebar {
      width: 320px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      z-index: 10;
    }
    
    .sidebar-header {
      background-color: var(--header-bg);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }
    
    .scan-btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .scan-btn:hover { 
      background-color: var(--accent-hover); 
      transform: translateY(-1px);
    }
    .scan-btn:active {
      transform: translateY(1px);
    }
    .scan-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none;}

    .peer-list {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .peer-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    
    .peer-item:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }
    
    .peer-item.active {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
    }
    
    .peer-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 15px;
      box-shadow: 0 4px 10px var(--accent-glow);
    }

    .peer-details { flex-grow: 1; overflow: hidden;}
    .peer-alias { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .peer-ip { font-size: 0.8rem; color: var(--text-muted); font-family: monospace;}
    
    .peer-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success-glow);
    }

    /* Main Chat Area (Right) */
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
      position: relative;
      background-image: radial-gradient(circle at center, rgba(59, 130, 246, 0.03) 0%, transparent 70%);
    }
    
    .empty-chat {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--chat-bg);
      z-index: 10;
      color: var(--text-muted);
    }
    
    .empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .chat-header {
      background-color: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    
    .chat-header .peer-avatar {
      width: 36px;
      height: 36px;
      font-size: 16px;
      box-shadow: none;
    }
    
    .chat-header .peer-alias { font-size: 1.1rem; font-weight: 600; margin-bottom: 2px;}
    
    .messages-container {
      flex-grow: 1;
      padding: 25px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .message {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .message.in {
      align-self: flex-start;
      background-color: var(--message-in);
      border-bottom-left-radius: 4px;
    }
    
    .message.out {
      align-self: flex-end;
      background-color: var(--message-out);
      border-bottom-right-radius: 4px;
    }
    
    .message-time {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.6);
      text-align: right;
      margin-top: 6px;
      user-select: none;
    }

    .file-attachment {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .file-icon { 
      font-size: 24px; 
      margin-right: 15px;
      background: rgba(255,255,255,0.1);
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
    }
    .file-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; word-break: break-all;}
    .file-meta { font-size: 0.75rem; opacity: 0.8;}

    /* Input Area */
    .input-area {
      background-color: var(--sidebar-bg);
      padding: 20px 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
    }
    
    .action-btn {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }
    .action-btn:hover { 
      color: var(--text-main); 
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }
    
    .message-input-wrapper {
      flex-grow: 1;
      position: relative;
    }
    
    .message-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .message-input:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    
    .send-btn {
      background-color: var(--accent);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 1.1rem;
      margin-left: 5px;
      box-shadow: 0 4px 10px var(--accent-glow);
    }
    .send-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.05);
    }
    .send-btn:active {
      transform: scale(0.95);
    }

    /* Transfer Toasts */
    .toast-container {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 320px;
    }
    
    .toast {
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .toast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .toast-filename {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    
    .toast-percent {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.8rem;
    }
    
    .progress-bar-bg {
      height: 6px;
      background-color: var(--input-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent);
      width: 0%;
      transition: width 0.2s ease-out;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    
    /* Modals & Alerts */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal-content {
      background: var(--sidebar-bg); padding: 30px; border-radius: 16px; width: 420px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    }
    .modal h3 { margin-bottom: 20px; font-size: 1.25rem; font-weight: 600;}
    .modal input { 
      width: 100%; padding: 12px 15px; margin-bottom: 20px; 
      border-radius: 8px; border: 1px solid var(--border); 
      background: var(--input-bg); color: white; 
      font-size: 0.95rem; outline: none;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: 500; transition: all 0.2s;}
    .btn-cancel { background: var(--input-bg); border: 1px solid var(--border); }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    .btn-primary { background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow);}
    .btn-primary:hover { background: var(--accent-hover); }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>P2P Network</h2>
      <button class="scan-btn" id="scan-btn" onclick="scanNetwork()">Scan</button>
    </div>
    <div class="peer-list" id="peer-list">
      <div style="padding: 30px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Click <strong>Scan</strong> to discover<br>peers on your network
      </div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="chat-area">
    <div class="toast-container" id="toast-container"></div>
    <div class="empty-chat" id="empty-chat">
      <div class="empty-icon">🪐</div>
      <h2>No Peer Selected</h2>
      <p style="margin-top: 10px; opacity: 0.7; font-size: 0.9rem;">Select a peer from the sidebar to start chatting or transferring files.</p>
    </div>
    
    <div class="chat-header">
      <div class="peer-avatar">💻</div>
      <div class="peer-details">
        <div class="peer-alias" id="active-peer-alias">Alias</div>
        <div class="peer-ip" id="active-peer-ip">192.168.x.x</div>
      </div>
    </div>
    
    <div class="messages-container" id="messages-container">
      <!-- Messages will load here -->
    </div>
    
    <div class="input-area">
      <!-- File Upload button -->
      <button class="action-btn" title="Send File" onclick="document.getElementById('file-input').click()">📎</button>
      <input type="file" id="file-input" style="display: none;" onchange="sendFile(this.files[0])">
      
      <!-- Folder/Path Upload button -->
      <button class="action-btn" title="Send Folder Path" onclick="openPathModal()">📁</button>
      
      <div class="message-input-wrapper">
        <input type="text" class="message-input" id="message-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
      </div>
      <button class="send-btn" onclick="sendTextMessage()">➤</button>
    </div>
  </div>

  <!-- Send Path Modal -->
  <div class="modal" id="path-modal">
    <div class="modal-content">
      <h3>Send Local Folder/File Path</h3>
      <input type="text" id="path-input" placeholder="e.g. /home/user/Documents/folder">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closePathModal()">Cancel</button>
        <button class="btn btn-primary" onclick="sendPath()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let activePeerIp = null;
    let autoRefreshInterval = null;
    let peersRefreshInterval = null;
    let knownPeersCount = 0;

    async function scanNetwork() {
      const btn = document.getElementById('scan-btn');
      btn.disabled = true;
      btn.textContent = 'Scanning...';
      try {
        const res = await fetch('/api/scan', { method: 'POST' });
        const data = await res.json();
        const list = document.getElementById('peer-list');
        list.innerHTML = '';
        
        if (!data.peers || data.peers.length === 0) {
          list.innerHTML = '<div style="padding: 30px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem;">No peers found.<br>Make sure they are running the app.</div>';
          knownPeersCount = 0;
        } else {
          knownPeersCount = data.peers.length;
          renderPeerList(data.peers);
        }
      } catch (e) {
        alert("Scan failed: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Scan';
      }
    }

    async function pollPeers() {
      try {
        const res = await fetch('/api/peers');
        const data = await res.json();
        if (data.peers && data.peers.length > 0) {
          if (data.peers.length !== knownPeersCount) {
             // If peer count changed (e.g. new message received), re-render sidebar silently
             knownPeersCount = data.peers.length;
             renderPeerList(data.peers);
          }
        }
      } catch (e) {}
    }

    function renderPeerList(peers) {
        const list = document.getElementById('peer-list');
        list.innerHTML = '';
        peers.forEach(peer => {
            const el = document.createElement('div');
            el.className = 'peer-item' + (activePeerIp === peer.ip ? ' active' : '');
            el.onclick = () => selectPeer(peer.ip, peer.alias || 'Unknown');
            el.innerHTML = `
              <div class="peer-avatar">💻</div>
              <div class="peer-details">
                <div class="peer-alias">${escapeHtml(peer.alias || 'Unknown')}</div>
                <div class="peer-ip">${peer.ip}</div>
              </div>
              <div class="peer-status-dot"></div>
            `;
            list.appendChild(el);
        });
    }

    function selectPeer(ip, alias) {
      activePeerIp = ip;
      document.getElementById('empty-chat').style.display = 'none';
      document.getElementById('active-peer-alias').textContent = alias;
      document.getElementById('active-peer-ip').textContent = ip;
      
      // Update UI active state
      document.querySelectorAll('.peer-item').forEach(el => {
        el.classList.remove('active');
        if(el.querySelector('.peer-ip').textContent === ip) el.classList.add('active');
      });

      loadChatHistory();
      if(autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(loadChatHistory, 2000);
    }

    async function loadChatHistory() {
      if(!activePeerIp) return;
      try {
        const res = await fetch(`/api/chat?peer=${activePeerIp}`);
        const data = await res.json();
        if(data.messages) {
          renderMessages(data.messages);
        }
      } catch (e) {}
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      
      // Smart scroll logic: check if we are near bottom before updating
      const isNearBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

      container.innerHTML = messages.map(msg => {
        const timeStr = new Date(msg.timestamp * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        if (msg.type === 'file') {
          return `
            <div class="message ${msg.direction}">
              <div class="file-attachment">
                <div class="file-icon">📦</div>
                <div>
                  <div class="file-name">${escapeHtml(msg.content)}</div>
                  <div class="file-meta">${msg.direction === 'in' ? 'Saved securely in inbox' : 'Transferred successfully'}</div>
                </div>
              </div>
              <div class="message-time">${timeStr}</div>
            </div>
          `;
        } else {
          return `
            <div class="message ${msg.direction}">
              <div>${escapeHtml(msg.content).replace(/\n/g, '<br>')}</div>
              <div class="message-time">${timeStr}</div>
            </div>
          `;
        }
      }).join('');

      if (isNearBottom) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function sendTextMessage() {
      if(!activePeerIp) return;
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if(!text) return;
      
      input.value = '';
      try {
        await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({target_ip: activePeerIp, message: text})
        });
        loadChatHistory();
      } catch(e) {
        alert("Failed to send message: " + e.message);
      }
    }

    function handleEnter(e) {
      if(e.key === 'Enter') sendTextMessage();
    }

    async function sendFile(file) {
      if(!file || !activePeerIp) return;
      
      const formData = new FormData();
      formData.append('target_ip', activePeerIp);
      formData.append('file', file);

      try {
        const res = await fetch('/api/send', { method: 'POST', body: formData });
        const data = await res.json();
        if(data.status !== 'success') throw new Error(data.message);
        loadChatHistory();
      } catch(e) {
        alert("Transfer failed: " + e.message);
      }
      document.getElementById('file-input').value = ''; // Reset
    }

    function openPathModal() {
      if(!activePeerIp) {
         alert("Select a peer first.");
         return;
      }
      document.getElementById('path-modal').style.display = 'flex';
      document.getElementById('path-input').focus();
    }
    
    function closePathModal() {
      document.getElementById('path-modal').style.display = 'none';
      document.getElementById('path-input').value = '';
    }
    
    async function sendPath() {
      const path = document.getElementById('path-input').value.trim();
      if(!path) return;
      
      const btn = document.querySelector('.btn-primary');
      const oldText = btn.textContent;
      btn.textContent = 'Sending...';
      btn.disabled = true;
      
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({target_ip: activePeerIp, file_path: path})
        });
        const data = await res.json();
        if(data.status !== 'success') throw new Error(data.message);
        closePathModal();
        loadChatHistory();
      } catch(e) {
        alert("Transfer failed: " + e.message);
      } finally {
        btn.textContent = oldText;
        btn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    // Allow enter key in modal
    document.getElementById('path-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendPath();
        }
    });
    
    async function pollProgress() {
      try {
        const res = await fetch('/api/progress');
        const data = await res.json();
        const container = document.getElementById('toast-container');
        
        if (!data.transfers || data.transfers.length === 0) {
          container.innerHTML = '';
          return;
        }
        
        container.innerHTML = data.transfers.map(t => {
          const percent = t.total > 0 ? Math.floor((t.transferred / t.total) * 100) : 0;
          const directionIcon = t.direction === 'out' ? '↗️ Sending' : '↙️ Receiving';
          return `
            <div class="toast">
              <div class="toast-header">
                <span style="font-size: 0.8rem; opacity: 0.7;">${directionIcon}</span>
                <span class="toast-percent">${percent}%</span>
              </div>
              <div class="toast-filename" title="${escapeHtml(t.file_name)}">${escapeHtml(t.file_name)}</div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
              </div>
              <div style="font-size: 0.75rem; opacity: 0.6; text-align: right;">
                ${formatBytes(t.transferred)} / ${formatBytes(t.total)}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {}
    }
    
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Start polling peers list automatically
    peersRefreshInterval = setInterval(pollPeers, 3000);
    setInterval(pollProgress, 1000);
    pollPeers(); // initial call
  </script>
</body>
</html>
